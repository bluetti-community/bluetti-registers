name: Python build json

on:
    push:
        branches: [ "main" ]
        paths:
        - 'bluetooth/**'
        - 'modbus-tcp/**'
        - 'schemas/**'
        - 'requirements.txt'
        - '*.py'
        - '.github/workflows/**'
        tags:
            - "*"
    pull_request:
        branches: [ "main" ]
        paths:
        - 'bluetooth/**'
        - 'modbus-tcp/**'
        - 'schemas/**'
        - 'requirements.txt'
        - '*.py'
        - '.github/workflows/**'

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        -   name: Set up Python 3.10
            uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
            with:
                python-version: "3.10"
        -   name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install flake8 pytest
                if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        -   name: Run validation
            run: python validate.py

    build:
        runs-on: ubuntu-latest
        needs: validate
        permissions:
            contents: write
        steps:
        -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        -   name: Set up Python 3.10
            uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
            with:
                python-version: "3.10"
        -   name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install flake8 pytest
                if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        -   name: Run generator
            run: python generate.py
        -   name: Upload bluetooth artifact
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
                name: bluetooth.json
                path: ./out/bluetooth.json
        -   name: Upload modbus-tcp artifact
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
                name: modbus-tcp.json
                path: ./out/modbus-tcp.json
        -   name: Release
            uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
            if: github.ref_type == 'tag'
            with:
                files: |
                    ./out/bluetooth.json
                    ./out/modbus-tcp.json
